<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Genesys Caller ID — Options</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; width: 460px; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
    input, textarea { width: 100%; padding: 6px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
    textarea { height: 160px; }
    .row { margin-top: 14px; display: flex; gap: 8px; }
    button { padding: 6px 14px; }
    .hint { color: #666; font-size: 11px; margin-top: 4px; }
    #status { margin-top: 10px; font-size: 12px; color: #0a7d2c; min-height: 16px; }
  </style>
</head>
<body>
  <h2 style="margin:0 0 4px 0;">Genesys Caller ID</h2>
  <div class="hint">Looks up incoming numbers in Salesforce and shows the matched name in the Genesys widget.</div>

  <label>Salesforce My Domain host</label>
  <input id="myDomainHost" placeholder="zillowhomeloans.my.salesforce.com">
  <div class="hint">The cookie domain used for the REST API. Must end in <code>.my.salesforce.com</code>.</div>

  <label>API version</label>
  <input id="apiVersion" placeholder="v59.0">

  <label>Objects (JSON)</label>
  <textarea id="objects"></textarea>
  <div class="hint">List of <code>{sobject, nameField, phoneFields}</code>. Default includes Lead, Contact, Loan__c.</div>

  <label>Cache TTL (ms)</label>
  <input id="cacheTtlMs" placeholder="300000">

  <div class="row">
    <button id="save">Save</button>
    <button id="clearCache">Clear cache</button>
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
